                      year: 2026
  /col-index:
    get:
      summary: Raw BEA Regional Price Parity index for 50 US metros
      parameters:
        - { name: city, in: query, required: false, schema: { type: string }, description: "Filter to one city", example: "Albuquerque, NM" }
      responses:
        "200":
          description: City → RPP/rent/home/income
          content:
            application/json:
              example:
                    data:
                      city: Albuquerque, NM
                      rpp: 95.5
                      rpp_rents: null
                      median_rent: 1085
                      median_home_value: 266700
                      median_income: 65604
                    meta:
                      source: BLS OEWS + BEA RPP + U.S. Census ACS + IRS (via kultranz.com)
                      vintage: '2026'
                      year: 2026
  /compound-interest:
    get:
      summary: Future value of an investment
      parameters:
        - { name: principal, in: query, required: true,  schema: { type: number }, example: "10000" }
        - { name: monthly,   in: query, required: false, schema: { type: number, default: 0 }, example: "500" }
        - { name: rate,      in: query, required: true,  schema: { type: number }, description: "Annual %", example: "7" }
        - { name: years,     in: query, required: true,  schema: { type: integer }, example: "20" }
