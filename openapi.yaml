  /net-worth:
    get:
      summary: Net worth from assets and liabilities
      parameters:
        - { name: cash, in: query, required: false, schema: { type: number, default: 0 }, example: "10000" }
        - { name: investments, in: query, required: false, schema: { type: number, default: 0 }, example: "150000" }
        - { name: property, in: query, required: false, schema: { type: number, default: 0 }, example: "400000" }
        - { name: mortgage, in: query, required: false, schema: { type: number, default: 0 }, example: "380000" }
        - { name: car, in: query, required: false, schema: { type: number, default: 0 }, example: "15000" }
        - { name: credit, in: query, required: false, schema: { type: number, default: 0 }, example: "5000" }
        - { name: otherAssets, in: query, required: false, schema: { type: number, default: 0 }, description: "Any other assets" }
        - { name: otherDebt, in: query, required: false, schema: { type: number, default: 0 }, description: "Any other liabilities" }
      responses:
        "200":
          description: assets, liabilities, net_worth
          content:
            application/json:
              example:
                    data:
                      assets: 560000
                      liabilities: 400000
                      net_worth: 160000
                    meta:
                      source: BLS OEWS + BEA RPP + U.S. Census ACS + IRS (via kultranz.com)
                      vintage: '2026'
                      year: 2026
  /debt-payoff:
    get:
      summary: Debt payoff schedule (avalanche, snowball, or both)
      parameters:
        - { name: debts, in: query, required: true, schema: { type: string }, description: "JSON array [{name,balance,rate,min}]", example: "[{\"name\":\"Card\",\"balance\":5000,\"rate\":22,\"min\":150}]" }
        - { name: extra, in: query, required: false, schema: { type: number, default: 0 }, example: "200" }
        - { name: mode,  in: query, required: false, schema: { type: string, enum: [avalanche, snowball, both] }, description: "both returns side-by-side comparison + avalanche_savings", example: "avalanche" }
      responses:
