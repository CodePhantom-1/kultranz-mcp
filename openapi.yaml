  /budget:
    get:
      summary: Budget — simple 50/30/20 split or full custom-category budget
      description: >
        If any category param (housing, food, transport, utilities, insurance, debt, savings, other)
        is present, returns the full per-category breakdown matching the website calculator.
        Otherwise returns a simple 50/30/20 split.
      parameters:
        - { name: income, in: query, required: true, schema: { type: number }, example: "5000" }
        - { name: savingsPct, in: query, required: false, schema: { type: number }, description: "Simple mode only — override default 20%", example: "20" }
        - { name: housing, in: query, required: false, schema: { type: number, default: 0 } }
        - { name: food, in: query, required: false, schema: { type: number, default: 0 } }
        - { name: transport, in: query, required: false, schema: { type: number, default: 0 } }
        - { name: utilities, in: query, required: false, schema: { type: number, default: 0 } }
        - { name: insurance, in: query, required: false, schema: { type: number, default: 0 } }
        - { name: debt, in: query, required: false, schema: { type: number, default: 0 }, description: "Debt payments" }
        - { name: savings, in: query, required: false, schema: { type: number, default: 0 }, description: "Savings & investments" }
        - { name: other, in: query, required: false, schema: { type: number, default: 0 }, description: "Entertainment, subscriptions" }
      responses:
        "200":
          description: "Simple: needs/wants/savings. Full: categories[], total_expenses, surplus, percentages."
          content:
            application/json:
              example:
                    data:
                      income: 5000
                      needs: 2500
                      wants: 1500
                      savings: 1000
                      savings_pct: 20
                    meta:
                      source: BLS OEWS + BEA RPP + U.S. Census ACS + IRS (via kultranz.com)
                      vintage: '2026'
                      year: 2026
  /salaries:
    get:
      summary: Real salary data by job and/or city (BLS OEWS)
      parameters:
        - { name: job,   in: query, required: false, schema: { type: string }, example: "nurse" }
        - { name: city,  in: query, required: false, schema: { type: string }, example: "Albuquerque, NM" }
        - { name: state, in: query, required: false, schema: { type: string }, example: "CA" }
      responses:
        "200":
          description: Up to 100 matching salary records with percentiles + city COL data
          content:
            application/json:
              example:
