openapi: 3.0.3
info:
  title: Kultranz API
  version: "0.1.0"
  description: >
    US personal-finance data + calculators backed by real government sources
    (BLS OEWS, BEA Regional Price Parities, U.S. Census ACS, IRS 2026 brackets).
    Free tier: 100 requests/day. No auth required — keys/metering handled by RapidAPI.
  contact:
    name: Kultranz
    url: https://kultranz.com
servers:
  - url: https://api.kultranz.com
    description: Production
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Meta:
      type: object
      properties:
        source: { type: string }
        vintage: { type: string }
        year: { type: integer }
  securitySchemes: {}
security: []
paths:
  /paycheck:
    get:
      summary: Take-home pay by US state (2026)
      description: Federal + FICA + state income tax. Single or married filing jointly.
      parameters:
        - { name: salary,         in: query, required: true,  schema: { type: number }, example: "120000" }
        - { name: state,          in: query, required: true,  schema: { type: string }, description: "2-letter code (CA, NY, DC...)", example: "CA" }
        - { name: filingStatus,   in: query, required: false, schema: { type: string, enum: [single, mfj] }, example: "single" }
        - { name: pretax401k,     in: query, required: false, schema: { type: number }, example: "10000" }
      responses:
        "200":
          description: Take-home breakdown
          content:
            application/json:
              example:
                    data:
                      gross: 120000
                      pretax: 10000
                      taxable_income: 93900
                      federal_tax: 15370
                      social_security: 7440
                      medicare: 1740
                      state_tax: 6153.42
                      total_tax: 30703.42
                      net: 79296.58
                      effective_rate: 25.59
                    meta:
                      source: BLS OEWS + BEA RPP + U.S. Census ACS + IRS (via kultranz.com)
                      vintage: '2026'
                      year: 2026
  /cost-of-living:
    get:
      summary: Compare cost of living between two US metros
      parameters:
        - { name: fromCity, in: query, required: true, schema: { type: string }, description: "City, ST e.g. Austin, TX", example: "Austin, TX" }
        - { name: toCity,   in: query, required: true, schema: { type: string }, example: "San Francisco, CA" }
        - { name: salary,   in: query, required: false, schema: { type: number, default: 100000 }, example: "120000" }
        - { name: rich,     in: query, required: false, schema: { type: string, enum: ["1"] }, description: "Include per-category monthly breakdown", example: "1" }
      responses:
        "200":
          description: Equivalent salary + cost-of-living gap
          content:
            application/json:
              example:
                    data:
                      from:
                        city: Austin, TX
                        rpp: 98.1
                      to:
                        city: San Francisco, CA
                        rpp: 115.6
                      equivalent_salary: 117838.94
                      gap_pct: 17.84
                    meta:
                      source: BLS OEWS + BEA RPP + U.S. Census ACS + IRS (via kultranz.com)
                      vintage: '2026'
                      year: 2026
  /tax-brackets:
    get:
      summary: Federal + state tax brackets (2026)
      parameters:
        - { name: state,        in: query, required: false, schema: { type: string }, example: "CA" }
        - { name: filingStatus, in: query, required: false, schema: { type: string, enum: [single, mfj] }, example: "single" }
      responses:
        "200":
          description: Brackets + standard deduction
